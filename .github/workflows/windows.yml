name: BURNER Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install WiX
        run: choco install wixtoolset --version=3.14.1 -y

      - name: Build BURNER
        run: .\gradlew.bat :desktopApp:packageExe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BURNER-Windows-Installer
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
