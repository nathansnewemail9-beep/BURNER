name: BURNER Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install WiX
        run: choco install wixtoolset --version=3.14.1 -y

      - name: Build installer
        run: .\gradlew.bat :desktopApp:packageExe

      - uses: actions/upload-artifact@v4
        with:
          name: BURNER-Windows
          path: desktopApp/build/compose/binaries/main/exe/*.exe
